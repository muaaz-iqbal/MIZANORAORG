name: Auto SEO (sitemap + RSS)

on:
  push:
    branches: [main]
    paths:
      - "assets/js/data.js"
      - "scripts/generate-seo.mjs"
      - ".github/workflows/seo.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sitemap.xml + rss.xml
        run: node scripts/generate-seo.mjs

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- sitemap.xml rss.xml; then
            echo "No SEO changes."
            exit 0
          fi
          git config user.name "mizanora-bot"
          git config user.email "mezanora.market@gmail.com"
          git add sitemap.xml rss.xml
          git commit -m "chore(seo): auto-regenerate sitemap + rss [skip ci]"
          git push
