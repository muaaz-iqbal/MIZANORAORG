<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 110" width="1100" height="110" role="img" aria-label="Rotating roles: Full-Stack Developer, Android Developer, Tooling Engineer">
  <title>What I do</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#141234"/>
    </linearGradient>
    <linearGradient id="roleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#f0abfc"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="1096" height="106" rx="16" fill="url(#card)" stroke="#312e81" stroke-width="1.6"/>
  <rect x="2" y="2" width="1096" height="106" rx="16" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1.6">
    <animate attributeName="stroke-opacity" values="0.08;0.45;0.08" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal dots -->
  <g>
    <circle cx="30" cy="26" r="5.5" fill="#fb7185"/>
    <circle cx="50" cy="26" r="5.5" fill="#fbbf24"/>
    <circle cx="70" cy="26" r="5.5" fill="#4ade80"/>
  </g>
  <text x="96" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="2" fill="#64748b">mizanora@org:~$ whoami</text>

  <!-- prompt -->
  <text x="44" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="30" fill="#22d3ee">›</text>

  <!-- rotating roles -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="34" font-weight="700" text-anchor="middle" fill="url(#roleGrad)">
    <text x="560" y="82" opacity="0">
      Full-Stack Web Developer
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0133;0.04;0.16;0.1867;1" dur="15s" repeatCount="indefinite"/>
      <tspan fill="#e879f9"> &#9615;<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.55;1" dur="1.1s" repeatCount="indefinite"/></tspan>
    </text>
    <text x="560" y="82" opacity="0">
      Android App Developer
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2133;0.24;0.36;0.3867;1" dur="15s" repeatCount="indefinite"/>
      <tspan fill="#e879f9"> &#9615;<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.55;1" dur="1.1s" repeatCount="indefinite"/></tspan>
    </text>
    <text x="560" y="82" opacity="0">
      Compiler &amp; Language Tooling
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4133;0.44;0.56;0.5867;1" dur="15s" repeatCount="indefinite"/>
      <tspan fill="#e879f9"> &#9615;<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.55;1" dur="1.1s" repeatCount="indefinite"/></tspan>
    </text>
    <text x="560" y="82" opacity="0">
      Live-Streaming Pipelines
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6133;0.64;0.76;0.7867;1" dur="15s" repeatCount="indefinite"/>
      <tspan fill="#e879f9"> &#9615;<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.55;1" dur="1.1s" repeatCount="indefinite"/></tspan>
    </text>
    <text x="560" y="82" opacity="0">
      Interfaces That Feel Alive
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8133;0.84;0.96;0.9867;1" dur="15s" repeatCount="indefinite"/>
      <tspan fill="#e879f9"> &#9615;<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.55;1" dur="1.1s" repeatCount="indefinite"/></tspan>
    </text>
  </g>

</svg>
