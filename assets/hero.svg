<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="1400" height="420" role="img" aria-label="Mizanora Org — animated banner">
  <title>MIZANORA ORG</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="45%" stop-color="#0a0f2b"/>
      <stop offset="100%" stop-color="#120a24"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="65%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#fb7185"/>
      <animate attributeName="x1" values="-1;0;-1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1;0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-2;2" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-1;3" dur="5.5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22d3ee"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#7dd3fc" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <clipPath id="titleClip"><rect x="0" y="0" width="1400" height="420"/></clipPath>
  </defs>

  <!-- backdrop -->
  <rect width="1400" height="420" fill="url(#bg)"/>
  <rect width="1400" height="420" fill="url(#grid)" opacity="0.9">
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- drifting light blobs -->
  <g filter="url(#soft)">
    <ellipse cx="260" cy="120" rx="240" ry="150" fill="url(#blobA)">
      <animate attributeName="cx" values="260;420;180;260" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="120;200;90;120" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1050" cy="300" rx="280" ry="170" fill="url(#blobB)">
      <animate attributeName="cx" values="1050;880;1180;1050" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;210;330;300" dur="19s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="60" rx="220" ry="120" fill="url(#blobC)">
      <animate attributeName="cx" values="700;520;860;700" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="120;90;140;120" dur="22s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- data-flow lines -->
  <g stroke="url(#lineGrad)" stroke-width="1.4" fill="none" opacity="0.7">
    <path d="M0 350 C 240 290, 380 400, 620 330 S 980 250, 1400 320">
      <animate attributeName="stroke-dasharray" values="0 1400;700 700;0 1400" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M0 90 C 300 150, 520 40, 780 110 S 1140 170, 1400 80">
      <animate attributeName="stroke-dasharray" values="0 1400;520 880;0 1400" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- floating particles -->
  <g fill="#e0f2fe">
    <circle cx="140" cy="300" r="2.2" opacity="0.8"><animate attributeName="cy" values="300;240;300" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.9;0.15" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="70" r="1.8" opacity="0.6"><animate attributeName="cy" values="70;130;70" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.8;0.1" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="380" r="2.6" opacity="0.7"><animate attributeName="cy" values="380;320;380" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.85;0.1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="150" r="1.6" opacity="0.5"><animate attributeName="cy" values="150;95;150" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.7;0.1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="330" r="2.4" opacity="0.8"><animate attributeName="cy" values="330;270;330" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.9;0.1" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="120" r="1.9" opacity="0.6"><animate attributeName="cy" values="120;180;120" dur="7.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.75;0.1" dur="7.5s" repeatCount="indefinite"/></circle>
    <circle cx="1210" cy="250" r="2.8" opacity="0.7"><animate attributeName="cy" values="250;190;250" dur="9.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.85;0.1" dur="9.5s" repeatCount="indefinite"/></circle>
    <circle cx="1320" cy="80" r="1.7" opacity="0.5"><animate attributeName="cy" values="80;140;80" dur="8.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.7;0.1" dur="8.5s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="230" r="1.4" opacity="0.45"><animate attributeName="cx" values="600;660;600" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="180" r="1.5" opacity="0.45"><animate attributeName="cx" values="260;200;260" dur="13s" repeatCount="indefinite"/></circle>
  </g>

  <!-- badge chip -->
  <g transform="translate(700,64)" opacity="0">
    <animate attributeName="opacity" values="0;1;1" dur="2.4s" begin="0.2s" fill="freeze"/>
    <rect x="-142" y="-19" width="284" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#7dd3fc" stroke-opacity="0.45"/>
    <circle cx="-116" cy="0" r="4" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="6" y="5.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" letter-spacing="3.2" fill="#bae6fd">BUILD • SHIP • ITERATE</text>
  </g>

  <!-- main title -->
  <g clip-path="url(#titleClip)">
    <text x="700" y="212" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          font-size="96" font-weight="800" letter-spacing="6" fill="url(#textGrad)" filter="url(#glow)">
      MIZANORA
      <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.3s" fill="freeze"/>
    </text>
    <text x="700" y="212" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          font-size="96" font-weight="800" letter-spacing="6" fill="url(#sheen)" opacity="0.5">
      MIZANORA
      <animate attributeName="opacity" values="0;0.65;0.65" dur="1.6s" begin="1.4s" fill="freeze"/>
    </text>
  </g>

  <!-- subtitle -->
  <text x="700" y="262" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="21" letter-spacing="1.6" fill="#e2e8f0" opacity="0">
    Muaaz Iqbal · Full-Stack &amp; Android Developer · Pakistan 🇵🇰
    <animate attributeName="opacity" values="0;1" dur="1.4s" begin="1.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="1.4s" begin="1.6s" fill="freeze"/>
  </text>

  <!-- animated underline -->
  <path d="M470 288 H930" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="460" stroke-dashoffset="460">
    <animate attributeName="stroke-dashoffset" values="460;0" dur="1.8s" begin="2s" fill="freeze"/>
  </path>

  <!-- three pillars -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="2.4" fill="#a5b4fc" text-anchor="middle">
    <text x="470" y="336" opacity="0">WEB PLATFORMS<animate attributeName="opacity" values="0;1" dur="0.8s" begin="2.8s" fill="freeze"/></text>
    <text x="700" y="336" opacity="0">ANDROID APPS<animate attributeName="opacity" values="0;1" dur="0.8s" begin="3.2s" fill="freeze"/></text>
    <text x="930" y="336" opacity="0">DEV TOOLS<animate attributeName="opacity" values="0;1" dur="0.8s" begin="3.6s" fill="freeze"/></text>
    <g stroke="#818cf8" stroke-opacity="0.5">
      <path d="M556 331 H584" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="3s" fill="freeze"/></path>
      <path d="M816 331 H844" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="3.4s" fill="freeze"/></path>
    </g>
  </g>

  <!-- corner brackets -->
  <g stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M28 60 V28 H60"/>
    <path d="M1340 28 H1372 V60"/>
    <path d="M1372 360 V392 H1340"/>
    <path d="M60 392 H28 V360"/>
  </g>

  <!-- vignette -->
  <rect width="1400" height="420" fill="none" stroke="#0b1020" stroke-opacity="0.9" stroke-width="2"/>
</svg>
